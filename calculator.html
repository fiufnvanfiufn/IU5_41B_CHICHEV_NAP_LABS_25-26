<!DOCTYPE html>
<html>
<head>
  <title>Астрологический Калькулятор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cosmic_calculator">
  <div id="planet_output" class="result">0</div>

  <div>
    <div>
      <button id="cosmic_clear" class="my-btn secondary">C</button>
      <button id="cosmic_sign" class="my-btn secondary">+/-</button>
      <button id="cosmic_lunar" class="my-btn secondary">🌙</button>
      <button id="cosmic_div" class="my-btn primary">/</button>
      <button id="cosmic_delete" class="my-btn primary">del</button>
    </div>

    <div>
      <button id="planet_neptune" class="my-btn">7</button>
      <button id="planet_uranus" class="my-btn">8</button>
      <button id="planet_saturn" class="my-btn">9</button>
      <button id="cosmic_mult" class="my-btn primary">x</button>
      <button id="cosmic_sqrt" class="my-btn primary">√</button>
    </div>

    <div>
      <button id="planet_jupiter" class="my-btn">4</button>
      <button id="planet_mars" class="my-btn">5</button>
      <button id="planet_earth" class="my-btn">6</button>
      <button id="cosmic_minus" class="my-btn primary">-</button>
      <button id="cosmic_square" class="my-btn primary">x²</button>
    </div>

    <div>
      <button id="planet_venus" class="my-btn">1</button>
      <button id="planet_mercury" class="my-btn">2</button>
      <button id="planet_sun" class="my-btn">3</button>
      <button id="cosmic_plus" class="my-btn primary">+</button>
      <button id="cosmic_factorial" class="my-btn primary">x!</button>
    </div>

    <div>
      <button id="planet_pluto" class="my-btn">0</button>
      <button id="planet_asteroid" class="my-btn">000</button>
      <button id="planet_comet" class="my-btn">.</button>
      <button id="cosmic_equal" class="my-btn primary execute">=</button>
    </div>
  </div>
</div>


  <div id="astral_tech">
    <a href="https://github.com/fiufnvanfiufn/IU5_41B_CHICHEV_NAP_LABS_25-26.git">
      <button class="git_btn">GitHub</button>
    </a>
    <details id="author_scroll">
      <summary>Информация об авторе</summary>
      <p>Выполнил студент группы ИУ5-41 Чичёв Иван</p>
    </details>
  </div>

  <div id="universe_switcher">
    <button id="btn_nebula_theme" class="switch_theme">Сменить тему</button>
  </div>

  <div class="lab-purpose">
    <p>
      Цель данной лабораторной работы - <mark>знакомство</mark> с инструментами HTML и CSS.
    </p>
  </div>
  <script src="script.js"></script>
</body>
</html>
